<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">

    <title>Template JavaScript</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>JavaScript · template</h1>
    <main>
        <section id="output"></section>
    </main>

    <footer>JavaScript para Frontend · joaogoncalves.net</footer>

    <script>
        let texto = '';

        // Tipos de dados permitidos
        let nome = 'Joao';      // strings, '', "", ´´;
        let idade = 35;         // Numbers; 
        let preco = 19.99;      // Numbers;
        let inscrito = true;    // Boleanos;
        let morada;             // Undefined;
        let telefone = null;    // null, "sem valor";

        texto += 'nome: ' + nome + ' -> ' + typeof nome + '<br>';
        texto += 'idade: ' + idade + ' -> ' + typeof idade + '<br>';
        texto += 'preco: ' + preco + ' -> ' + typeof preco + '<br>';
        texto += 'inscrito: ' + inscrito + ' -> ' + typeof inscrito + '<br>';
        texto += 'morada: ' + morada + ' -> ' + typeof morada + '<br>';
        texto += 'telefone: ' + telefone + ' -> ' + typeof telefone + '<br>';

        const x = 15;
        const y = 4;

        texto += '(19.99 * 3).toFixed(2) = ' + (19.99 * 3).toFixed(2) // 59.97 transforma o resultado em string

        

        // escrever na página
        let output = document.getElementById('output');
        output.innerHTML = texto;
    </script>
</body>
</html>
