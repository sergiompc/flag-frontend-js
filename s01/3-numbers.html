<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Template JavaScript</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>JavaScript · template</h1>
    <main>
        <section id="output"></section>
    </main>

    <footer>JavaScript para Frontend · joaogoncalves.net</footer>

    <script>
        let texto = '';

        const x = 15;
        const y = 4;

        texto += 'x + y = ' + (x + y) + '<br>';
        texto += 'x - y = ' + (x - y) + '<br>';
        texto += 'x * y = ' + (x * y) + '<br>';
        texto += 'x / y = ' + (x / y) + '<br>';
        texto += 'x ** y = ' + (x ** y) + '<br>';
        texto += 'x % y = ' + (x % y) + '<br>';            

        // texto += '(19.99 * 3).toFixed(2) = ' + (19.99 * 3).toFixed(2) + '<br>';  // 59.97 transforma o resultado em string

        let pontos = 10;
        pontos = pontos +5;
        pontos += 5;
        pontos -= 1;
        pontos *= 2;
        pontos ++;

        texto += '<br>Pontos: ' + pontos + '<br>';
        
        // Decimais
        texto += '<br> 0.1 + 02 = ' + (0.1+0.2) + '<br>';
        const total = 19.99 * 3;
        texto += 'Total: ' + total + '<br>';
        texto += 'Total: ' + total.toFixed(3) + '<br>';

        // arredondar numeros, objet Math
        texto += '<hr>';
        texto += '<br>Math.round(4.6) ' + Math.round(4.6) + '<br>';
        texto += '<br>Math.ceil(4.6) ' + Math.ceil(4.6) + '<br>';
        texto += '<br>Math.floor(4.6) ' + Math.floor(4.6) + '<br>';

        // Texto para numero
        texto += '<hr>';
        texto += '<br> "42" + 1 = ' + ("42" + 1) + '<br>';
        texto += '<br> Number("42") + 1 = ' + (Number("42") + 1) + '<br>'; // casting


        // escrever na página
        let output = document.getElementById('output');
        output.innerHTML = texto;

    </script>
</body>
</html>
