<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Template JavaScript</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>JavaScript · template</h1>
    <main>
        <section id="output"></section>
    </main>

    <footer>JavaScript para Frontend · joaogoncalves.net</footer>

    <script>
        let texto = '';

        // 1. Guardar os dados da conta
        const restaurante = "Tasca do Zé";
        const numeroPessoas = 4;
        const valorComida = 62.50;
        const valorBebidas = 18.40;
        const percentagemGorjeta = 10;
        const orcamentoPorPessoa = 25;

        // 2. Calcular os valores
        let subtotal = valorComida + valorBebidas;
        let gorjeta = subtotal * (percentagemGorjeta / 100);
        let total = subtotal + gorjeta;
        let valorPorPessoa = total / numeroPessoas;

        // 3. Verificar se está dentro do orçamento
        let dentroOrcamento = valorPorPessoa <= orcamentoPorPessoa;

        // 4. Construir o texto da conta
        texto += `
            ${restaurante}<br>
            Comida: ${valorComida.toFixed(2)} €<br>
            Bebidas: ${valorBebidas.toFixed(2)} €<br>
            Subtotal: ${subtotal.toFixed(2)} €<br>
            Gorjeta (${percentagemGorjeta}%): ${gorjeta.toFixed(2)} €<br>
            Total: ${total.toFixed(2)} €<br>
            A dividir por ${numeroPessoas}: ${valorPorPessoa.toFixed(2)} € cada<br>
            Dentro do orçamento (${orcamentoPorPessoa.toFixed(2)} € por pessoa): ${dentroOrcamento}
        `;
        
        /// escrever na página
        let output = document.getElementById('output');
        output.innerHTML = texto;

    </script>
</body>
</html>
