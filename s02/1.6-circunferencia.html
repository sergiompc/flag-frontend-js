<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Template JavaScript</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>JavaScript · template</h1>
    <main>
        <section id="output"></section>
    </main>

    <footer>JavaScript para Frontend · joaogoncalves.net</footer>

    <script>
        let texto = '';

        // 1. Pedir o raio da circunferência
        const raio = Number(prompt("Introduz o raio da circunferência:"));

        // 2. Calcular o perímetro e a área
        const perimetro = 2 * Math.PI * raio;
        const area = Math.PI * (raio ** 2);

        // 3. Construir o texto
        texto += `
            A circunferência<br>
            Raio: ${raio.toFixed(2)}<br>
            Perímetro: ${perimetro.toFixed(2)}<br>
            Área: ${area.toFixed(2)}
        `;

        
        /// escrever na página
        let output = document.getElementById('output');
        output.innerHTML = texto;

    </script>
</body>
</html>
