<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Template JavaScript</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <h1>JavaScript · template</h1>
    <main>
        <section id="output"></section>
    </main>

    <footer>JavaScript para Frontend · joaogoncalves.net</footer>

    <script>
        let texto = '';

        // 1. Guardar os dados da pessoa
        const nome = "Rui";
        const apelido = "Costa";
        const cidade = "Lisboa";
        const anoNascimento = 1994;
        const anoAtual = 2026;
        const profissao = "designer";
        const aprenderJavaScript = true;

        // 2. Calcular a idade
        let idade = anoAtual - anoNascimento;

        // 3. Construir o nome completo e as iniciais
        let nomeCompleto = `${nome} ${apelido}`;
        let iniciais = `${nome[0]}${apelido[0]}`;

        // 4. Construir o cartão
        texto += `
            ${nomeCompleto.toUpperCase()} (${iniciais.toUpperCase()})<br>
            ${idade} anos, de ${cidade}<br>
            Profissão: ${profissao}<br>
            O nome completo tem ${nomeCompleto.length} caracteres.<br>
            A aprender JavaScript: ${aprenderJavaScript}<br>
            Daqui a 10 anos terá ${idade + 10} anos.
        `;

        /// escrever na página
        let output = document.getElementById('output');
        output.innerHTML = texto;

    </script>
</body>
</html>
