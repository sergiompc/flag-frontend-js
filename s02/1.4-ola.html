<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Template JavaScript</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <h1>JavaScript · template</h1>
    <main>
        <section id="output"></section>
    </main>

    <footer>JavaScript para Frontend · joaogoncalves.net</footer>

    <script>
        let texto = '';

        /// 1. Pedir o nome e o apelido
        const nome = prompt('Qual é o teu nome?');
        const apelido = prompt('Qual é o teu apelido?');

        /// 2. Juntar o nome e o apelido
        const nomeCompleto = nome + " " + apelido;     
    
        /// 3. Mostrar resultado mensagem
        texto += `
            Olá, ${nomeCompleto}!<br>
            Bem-vindo ao JavaScript.<br>
            O teu nome completo tem ${nomeCompleto.length} caracteres.<br>
            Em maiúsculas: ${nomeCompleto.toUpperCase()}
        `;

        /// escrever na página
        let output = document.getElementById('output');
        output.innerHTML = texto;

    </script>
</body>
</html>
